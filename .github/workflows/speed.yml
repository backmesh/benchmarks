name: speed
on:
  workflow_dispatch:
    inputs:
      round: { description: round number, required: true }
permissions:
  contents: read
jobs:
  express:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, backmesh-2, backmesh-4]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: expressjs/express
          ref: v5.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: install
        run: npm install --no-audit --no-fund
      - name: test
        run: npm test
      - name: info
        run: nproc; free -g | head -2
