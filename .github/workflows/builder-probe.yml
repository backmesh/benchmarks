name: builder-probe
# Cache phase 3, row DS: which setting the runner could make before a job so
# that a plain `docker build`, in a later step, uses a builder of its choosing
# and still loads the image into the VM's Docker.
on:
  push:
    branches: [builder-probe]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        how: [use-default, env, alias]
    runs-on: backmesh-4
    steps:
      - name: The runner's part
        run: |
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          docker buildx version
          sudo mkdir -p /mnt/bkstate
          docker run -d --name bk --privileged -v /mnt/bkstate:/var/lib/buildkit moby/buildkit:buildx-stable-1 >/dev/null
          docker buildx create --name bm --driver remote --driver-opt default-load=true docker-container://bk
          docker buildx inspect --bootstrap bm >/dev/null
          case ${{ matrix.how }} in
            use-default) docker buildx use --default bm ;;
            env) echo BUILDX_BUILDER=bm >>"$GITHUB_ENV" ;;
            alias) docker buildx install; docker buildx use --default bm ;;
          esac
          cat ~/.docker/config.json ~/.docker/buildx/current 2>/dev/null || true
      - name: The job's own step
        run: |
          mkdir -p ctx && printf 'FROM busybox\nRUN echo hi-$RANDOM\n' >ctx/Dockerfile
          docker build -t probe ctx 2>&1 | tee out.txt
          b=$(grep -m1 -oE 'building with "[^"]+"' out.txt || echo "no builder line")
          l=$(docker image inspect probe >/dev/null 2>&1 && echo loaded || echo "not loaded")
          s=$(sudo du -sh /mnt/bkstate | cut -f1)
          echo "RESULT ${{ matrix.how }}: $b; $l; bm state $s"
